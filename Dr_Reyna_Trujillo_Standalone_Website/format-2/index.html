<script>
const $=s=>document.querySelector(s);
const P=(d)=>`<path class="pen" pathLength="1" d="${d}"/>`;

const circ=t=>`<span class="circ">${t}<svg class="dd" viewBox="0 0 200 80" preserveAspectRatio="none" aria-hidden="true">${P(OV)}</svg></span>`;
const und=t=>`<span class="und">${t}<svg class="dd" viewBox="0 0 200 12" preserveAspectRatio="none" aria-hidden="true">${P('M4 8C50 2 100 12 196 4')}</svg></span>`;

// cover
sheets.push(`<section class="sheet p cover" data-l="Curriculum Vitae"><h1>Opportunity<span class="nm hand">Dr. Reyna Trujillo, Ed.D.${arrow()}</span><svg class="dd ov" viewBox="0 0 200 80" preserveAspectRatio="none" aria-hidden="true">${P('M6 50C4 20 70 6 120 6C170 6 198 24 196 46C192 68 140 76 96 74C44 72 6 66 8 44C10 28 40 18 80 14')}</svg>${star('right:-5%;top:44%')}</h1><span class="pill">${circ('Executive leader · Educator · Entrepreneur')}</span><div class="foot"><span>Los Angeles, California — 2026</span><span class="hand">scroll ↓</span><span>Ed.D. · LACCD · Project Access</span></div></section>`);
// hello
S('d','Hello',`<div class="hello"><figure class="pic" id="pic" tabindex="0" role="button" aria-pressed="false" aria-label="Switch portrait of Dr. Reyna Trujillo"><div class="im"><img src="../assets/reyna-trujillo.png" alt="Portrait of Dr. Reyna Trujillo"><img src="../assets/reyna-trujillo-alt.jfif" alt="Dr. Reyna Trujillo smiling"></div><figcaption>that’s me!</figcaption></figure>
<div><h2>Hello, I’m ${und('Reyna.')}</h2><p class="lead">Executive leader with more than 20 years in higher education, workforce development, entrepreneurship, nonprofit leadership, healthcare and community partnerships. I build organizations, secure and steward multimillion-dollar public and private investment, and lead initiatives that expand educational opportunity, workforce mobility and economic development.</p>
<div class="btns"><a class="btn" href="mailto:trujilr2@laccd.edu">trujilr2@laccd.edu</a><a class="btn" href="tel:+13233796572">323.379.6572</a><a class="btn" href="https://linkedin.com/in/reytrujillo" target="_blank" rel="noopener">LinkedIn</a><button class="btn" data-copy="trujilr2@laccd.edu">Copy email</button></div></div></div>
<div class="nums">${[['20+','years leading'],['$100M+','stewarded'],['$15M+','operating budgets'],['4','organizations founded'],['50+','programs developed'],['200+','partnerships']].map(([a,b])=>`<div><b>${a}</b><span>${b}</span></div>`).join('')}</div>${star('right:2%;top:-8%')}`);

S('p','Education',`<h2>Education</h2><div class="grid"><div><h3>Ed.D., Organizational Leadership</h3><p>University of La Verne</p></div><div><h3>M.Ed., Leadership and Administration</h3><p>University of Southern California</p></div><div><h3>B.S., Child Development</h3><p>University of La Verne</p></div></div>
<p class="lead" style="margin-top:6vh">Dissertation: <i>${und('From Compliance to Transformation')}: Faculty Perspectives on AI-Driven Professional Development.</i> A qualitative study of faculty perceptions of AI-driven professional development in California Community Colleges, on moving beyond compliance toward ethical AI adoption and transformational culture.</p>
<div class="grid" style="margin-top:6vh"><div><h3>CCTC permits</h3>${ul(['Child Development Associate Teacher Permit (2011)','Child Development Site Supervisor Permit (2013)'])}</div><div><h3>Certificates</h3>${ul(['Children with Special Needs (2010)','Infant/Toddler (2010)','Family Child Care Provider (2010)'])}</div><div><h3>Professional development</h3>${ul(['Dr. Yasmin Davidds Leadership Institute','LACCD Safe Zone Train-the-Trainer','AI and Educational Technology Institutes','Strong Workforce, CCC Chancellor’s Office and LARC institutes','Entrepreneurship and economic development institutes'])}</div></div>`);
// skills
S('d','Expertise',`<h2>${circ('Skills')}</h2>${chips(['Executive Leadership','Higher Education Administration','Organizational Strategy','Workforce & Economic Development','Entrepreneurship & Innovation','Strategic Partnerships','Public Policy','Government & Community Relations','Fiscal Stewardship','Grant Administration','Resource Development','Board Governance','Organizational Risk Management','Enterprise Growth & Sustainability','AI & Digital Innovation','Research','Teaching & Learning','Executive Consulting','Philanthropy'])}<p class="hand" style="margin-top:5vh">fiscal stewardship across state appropriations, federal and state grants, foundation awards, philanthropy and public-private partnerships</p>`);
// roles
const roles=[
['2026–Present','Executive Director','Susan Rubio Entrepreneurship & Innovation Center · East Los Angeles College, LACCD',['$4.5M+ overseen'],'A regional hub for entrepreneurship, workforce development, innovation and economic mobility serving students, alumni, small businesses and community entrepreneurs.',['Oversees about $2.5M in state appropriations to establish and run the Center','Secured an additional $2M in sustainability funding','Directs budgets, contracts, staffing, partnerships and performance across multiple funding streams']],
['2023–Present','President & CEO','Communities of San Gabriel Valley Project Access · 501(c)(3)',['~$1.5M annual budget'],'Founded and leads a regional nonprofit advancing digital equity and equitable access to public resources.',['Conceived Community Linked Sources®, an AI-powered platform connecting residents with verified health, education, workforce, housing and community resources across LA County','Built partnerships with public agencies, schools, healthcare providers and philanthropy','Leads fundraising, governance, strategy and technology innovation']],
['2025–Present','Strong Workforce Program Coordinator','West Los Angeles College · LACCD',['$6M+ stewarded'],'Leads CTE, workforce, adult education and regional mobility initiatives funded by SWP, CAEP and Perkins V.',['Built healthcare career pathways for adult learners and English language learners','Led state approval of noncredit certificates in healthcare, AI, construction, business and workforce readiness','Works with LARC, employers, workforce boards and the Chancellor’s Office','Serves disadvantaged students, foster youth, veterans, single parents and justice-impacted students']],
['2020–2022','Senior Director, Workforce Development','AltaMed Health Services · one of the nation’s largest FQHCs · 2020–2022',['~$6M annual budget','$100M+ in initiatives'],'Executive leadership for workforce strategy, talent development and healthcare career pathways across a multi-site system.',['Led multidisciplinary teams in workforce planning and employee development','Expanded partnerships with colleges, universities and workforce boards','Improved retention, leadership development and clinical talent pipelines','Ensured federal, state and private funding compliance']],
['2012–2019','Dream Resource Center Coordinator','East Los Angeles College · LACCD · 2012–2019',['State Replacement Funds'],'Lead coordinator for one of the first Dream Resource Centers in LACCD, supporting undocumented students, DACA recipients and mixed-status families.',['Co-led the LACCD Resolution on Equitable Access','Co-developed the districtwide Safe Zone Train-the-Trainer','Partnered with legal service providers, nonprofits and philanthropy','Managed scholarships, donor partnerships, outreach and legal service coordination']],
['Classroom','Elementary School Teacher','Sierra Park Elementary · Los Angeles Unified School District',[],'Standards-based K–5 science through a specialized laboratory model.',['Taught every K–5 classroom through a rotating science lab','Made the school a model partner of the Los Angeles Zoo','Built a living science lab for animal care and ecology','Launched an after-school science program with NASA’s Jet Propulsion Laboratory, an early LAUSD collaboration of its kind']],
['13+ yrs','Program Coordinator','Girls Inc. of Greater Los Angeles',[],'Youth development for girls ages 6–18 in leadership, STEM and college readiness; National Trainer.',['Organizational liaison for the first MOU with LAUSD','Scaled the partnership from 1 pilot school to 3 to more than 40 elementary schools','Trained educators nationally in Operation SMART and leadership curricula','Established STEM partnerships including JPL']]];
roles.forEach(([y,t,o,m,s,b],i)=>S(i%2?'d':'p','Experience',`<div class="proj"><div><div class="yr">${y}</div>${m.length?`<div class="note hand">${m[0]}${arrow('position:relative;display:block')}</div>`:''}</div><div><h2 style="font-size:clamp(2rem,5vw,4.2rem)">${t}</h2><div class="org">${o}</div>${m.map((x,j)=>`<span class="money">${j?x:circ(x)}</span>`).join('')}<p class="lead">${s}</p>${ul(b)}</div></div>${i%2?'':star('right:0;top:-6%')}`));

S('p','Advisory',`<h2>Advisory</h2><p class="lead">Founder and Principal Consultant, <b>Trujillo Strategy & Innovation Group, LLC.</b> Executive consulting, strategic planning, organizational assessment, curriculum development, workforce planning, grant strategy, keynotes, leadership facilitation and executive coaching across California.</p>
<table style="margin-top:5vh"><tr><th>client</th><th>focus</th></tr><tr><td>Los Angeles Regional Consortium</td><td>AI, CTE, faculty development, workforce strategy</td></tr><tr><td>BuildLACCD</td><td>Workforce development, paid internship systems</td></tr><tr><td>Didi Hirsch / TEEN LINE at Cedars-Sinai</td><td>Curriculum, leadership training, youth mental health, volunteer development</td></tr><tr><td>K–12 Foothill Consortium</td><td>Innovation advisor, startup mentoring, angel investment</td></tr><tr><td>California Community Colleges</td><td>Strategic planning, workforce development</td></tr><tr><td>Healthcare organizations</td><td>Workforce strategy and organizational development</td></tr><tr><td>Nonprofit organizations</td><td>Executive coaching, board development, strategic planning</td></tr></table>`);
